[project]
name = "zanity-monitoring"
version = "0.1.0"
description = "zanity VPN monitoring: alerter (ctl-host) and external watchdog (exit-1)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pillow==10.2.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["alerter", "watchdog"]
